<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Grillz Direct</title>
  <meta name="description" content="Get in touch with Grillz Direct by email or on Instagram @grillzdirect.">
  <script>try{var t=JSON.parse(localStorage.getItem("gd-theme"));if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;400;500;600&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-head container reveal">
      <span class="eyebrow">Say hi</span>
      <h1>Contact</h1>
      <p>Questions, custom ideas or order updates — we usually reply within 24–48 hours.</p>
    </section>

    <section class="container grid grid-2" style="align-items:start">
      <form class="card reveal" id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
        <input type="hidden" name="form-name" value="contact">
        <p hidden><label>Leave this empty <input name="bot-field"></label></p>
        <div class="row">
          <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        </div>
        <div class="field">
          <label for="topic">Topic</label>
          <select id="topic" name="topic">
            <option>General question</option>
            <option>Custom design quote</option>
            <option>Existing order</option>
            <option>Mould kit help</option>
          </select>
        </div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" required placeholder="Tell us what you're after…"></textarea></div>
        <button class="btn" type="submit">Send message</button>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>

      <div class="grid" style="gap:24px">
        <a class="card reveal" href="mailto:prodmizzdirect@gmail.com" style="text-decoration:none;color:inherit">
          <span class="eyebrow">Email</span>
          <h3 style="word-break:break-all">prodmizzdirect@gmail.com</h3>
          <p>Best for quotes and order questions.</p>
        </a>
        <a class="card reveal" href="https://www.instagram.com/grillzdirect/" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
          <span class="eyebrow">Instagram</span>
          <h3>@grillzdirect</h3>
          <p>See our latest work and DM us your inspo.</p>
        </a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
